name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: API types match api/openapi.json
        run: npm run api:types && git diff --exit-code -- src/models/api/schema.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Bundle budget (buyer pages)
        run: npm run budget

  e2e:
    name: End-to-end (Playwright, real backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vekro
          POSTGRES_PASSWORD: vekro
          POSTGRES_DB: vekro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vekro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-e2e-secret-key
      DATABASE_URL: postgresql+psycopg://vekro:vekro@localhost:5432/vekro
      ALEMBIC_DATABASE_URL: postgresql+psycopg://vekro:vekro@localhost:5432/vekro
      # B8 e2e reads the SMS sign-in code from the API (never enabled in production).
      PHONE_CODE_DEV_ECHO: 'true'
      # Every e2e seller verifies a payout number from 127.0.0.1 (backend #342): lift the per-IP cap.
      PHONE_CODE_CLIENT_HOURLY_LIMIT: '500'
      # A throwaway support admin for the console e2e (created below with the backend's CLI).
      E2E_ADMIN_PHONE: '+254700000001'
      E2E_ADMIN_PASSWORD: ci-admin-password-1
      # Card e2e (M22): Pesapal's public sandbox demo merchant, kept in repository secrets. Without
      # them the card spec skips; with them the backend talks to Pesapal's sandbox for real and only
      # the browser's trip to Pesapal's page is stubbed (e2e/card.spec.ts).
      PESAPAL_CONSUMER_KEY: ${{ secrets.PESAPAL_SANDBOX_CONSUMER_KEY }}
      PESAPAL_CONSUMER_SECRET: ${{ secrets.PESAPAL_SANDBOX_CONSUMER_SECRET }}
      PESAPAL_BASE_URL: https://cybqa.pesapal.com/pesapalv3
      FRONTEND_URL: http://localhost:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CKmellow/Vekro-backend
          ref: main
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Start the backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          VEKRO_ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" python -m app.cli create-admin --phone "$E2E_ADMIN_PHONE" --name "CI Support"
          if [ -n "$PESAPAL_CONSUMER_KEY" ]; then
            touch ../pesapal.env
            python -m app.services.custody.pesapal_ipn_registration \
              --callback-url http://127.0.0.1:8000/payments/pesapal/ipn --notification-type GET --env-file ../pesapal.env
            export PESAPAL_IPN_ID="$(sed -n 's/^PESAPAL_IPN_ID=//p' ../pesapal.env)" PESAPAL_ENABLED=true
            echo "E2E_CARD=1" >> "$GITHUB_ENV"
          fi
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat ../backend.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Backend log
        if: failure()
        run: cat backend.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # The HTML report embeds traces; test-results keeps the raw traces, screenshots and videos.
          path: |
            playwright-report
            test-results
          retention-days: 7

  image:
    name: Web image (build and nginx config check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vekro-web:ci .
      - name: No secrets in the image (#298; the GHCR image is public)
        run: |
          python3 -I scripts/scan-image-secrets.py --self-test
          python3 -I scripts/scan-image-secrets.py vekro-web:ci \
            --path /usr/share/nginx/html --path /etc/nginx/templates --path /etc/nginx/conf.d
      - name: nginx config renders and is valid
        run: docker run --rm -e API_UPSTREAM=http://127.0.0.1:8000 vekro-web:ci sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'

