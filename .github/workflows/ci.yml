name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: API types match api/openapi.json
        run: npm run api:types && git diff --exit-code -- src/models/api/schema.d.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Bundle budget (buyer pages)
        run: npm run budget

  e2e:
    name: End-to-end (Playwright, real backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vekro
          POSTGRES_PASSWORD: vekro
          POSTGRES_DB: vekro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vekro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-e2e-secret-key
      DATABASE_URL: postgresql+psycopg://vekro:vekro@localhost:5432/vekro
      ALEMBIC_DATABASE_URL: postgresql+psycopg://vekro:vekro@localhost:5432/vekro
      # B8 e2e reads the SMS sign-in code from the API (never enabled in production).
      PHONE_CODE_DEV_ECHO: 'true'
      # A throwaway support admin for the console e2e (created below with the backend's CLI).
      E2E_ADMIN_PHONE: '+254700000001'
      E2E_ADMIN_PASSWORD: ci-admin-password-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CKmellow/Vekro-backend
          ref: main
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Start the backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          VEKRO_ADMIN_PASSWORD="$E2E_ADMIN_PASSWORD" python -m app.cli create-admin --phone "$E2E_ADMIN_PHONE" --name "CI Support"
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 1; done
          cat ../backend.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Backend log
        if: failure()
        run: cat backend.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
