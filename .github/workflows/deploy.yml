# Deploy from main (M17 #134). Builds the web image (nginx with the security headers and the /api
# proxy), publishes it to GitHub Container Registry, then asks the host to roll it out.
# The host is set up once by hand (docs/DEPLOY.md); until DEPLOY_HOOK_URL is set, only the image is published.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_SUPPORT_PHONE=${{ vars.VITE_SUPPORT_PHONE }}
            VITE_SUPPORT_WHATSAPP=${{ vars.VITE_SUPPORT_WHATSAPP }}
            VITE_SUPPORT_EMAIL=${{ vars.VITE_SUPPORT_EMAIL }}
            VITE_SUPPORT_HOURS=${{ vars.VITE_SUPPORT_HOURS }}
          tags: |
            ghcr.io/ckmellow/vekro-web:${{ github.sha }}
            ghcr.io/ckmellow/vekro-web:latest
      - name: Roll out
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        if: env.DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"
