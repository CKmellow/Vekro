# Deploy from main (M17 #134, #296). Builds the web image (nginx with the security headers and the
# /api proxy), publishes it to GitHub Container Registry, then, once the VM exists and the repository
# variable DEPLOY_ENABLED is "true", rolls it out over SSH with the backend's deploy/deploy.sh (pull,
# restart, health check, roll back if unhealthy). Setup: the backend's docs/hosting.md section 7.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_SUPPORT_PHONE=${{ vars.VITE_SUPPORT_PHONE }}
            VITE_SUPPORT_WHATSAPP=${{ vars.VITE_SUPPORT_WHATSAPP }}
            VITE_SUPPORT_EMAIL=${{ vars.VITE_SUPPORT_EMAIL }}
            VITE_SUPPORT_HOURS=${{ vars.VITE_SUPPORT_HOURS }}
            VITE_ANCHOR_CHAIN_ID=${{ vars.VITE_ANCHOR_CHAIN_ID }}
            VITE_ANCHOR_REGISTRY_ADDRESS=${{ vars.VITE_ANCHOR_REGISTRY_ADDRESS }}
            VITE_ANCHOR_RPC_URL=${{ vars.VITE_ANCHOR_RPC_URL }}
          tags: |
            ghcr.io/ckmellow/vekro-web:${{ github.sha }}
            ghcr.io/ckmellow/vekro-web:latest

  roll-out:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: SSH key and known host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: cloudflared (SSH through Cloudflare Access, no inbound port on the VM)
        if: env.CF_ACCESS_CLIENT_ID != ''
        run: |
          curl -fsSLo cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.1/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
      - name: Roll out
        run: |
          proxy=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ]; then
            proxy=(-o "ProxyCommand=cloudflared access ssh --hostname %h --id $CF_ACCESS_CLIENT_ID --secret $CF_ACCESS_CLIENT_SECRET")
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${proxy[@]}" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd '${DEPLOY_PATH:-vekro}' && deploy/deploy.sh web '${{ github.sha }}'"
